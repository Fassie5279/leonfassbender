name: Restore CNAME
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure CNAME exists
        run: |
          if [ ! -f CNAME ]; then
            echo "leonfassbender.com" > CNAME
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add CNAME
            git commit -m "Restore CNAME"
            git push
          fi
